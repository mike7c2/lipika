[package]
name = "lipika"
version = "0.1.0"
edition = "2024"
description = "Multi-source, multi-observer IQ scene simulator for distributed-receiver and adjacent SDR work."
license = "MIT"
readme = "README.md"

[[bin]]
name = "lipika"
path = "src/bin/lipika.rs"

[lib]
name = "lipika"
path = "src/lib.rs"

[dependencies]
# Numerical
ndarray = { version = "0.16", features = ["rayon"] }
num-complex = "0.4"
num-traits = "0.2"

# Parallelism
rayon = "1.10"

# RNG
rand = "0.8"
rand_distr = "0.4"
rand_xoshiro = "0.6"

# Orbital propagation
sgp4 = "2.3"

# CLI and config
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# Errors and logging
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Datetime helpers (TLE epoch parsing).
chrono = "0.4"

[features]
default = []

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "iq_generation"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
debug = true
