# Real GPS constellation → position fix in GNSS-SDR.
#
# Eight live GPS satellites (TLEs from Celestrak, epoch ~2026-150) that are all
# above 15° elevation over Glasgow at 2026-05-31 23:00 UTC, propagated by SGP4
# and rotated TEME → ECEF. Each carries FULL LNAV with an ephemeris fitted
# (osculating at toe) to its own trajectory, so the fix resolves at the true
# receiver location; the residual reflects the two-body-vs-SGP4 ephemeris
# approximation over the window — an end-to-end error metric for the stack.
#
# epoch_unix is divisible by 6 (subframe edges align to the GPS 6 s Z-count).

[scene]
epoch_unix = 1780268400.0   # 2026-05-31 23:00:00 UTC
duration_s = 600.0

[[transmitter]]
name = "gps_prn24"
carrier_hz = 1_575_420_000.0
tx_power_dbw = 27.0
kind = "ca_code"
prn = 24
epoch_unix = 1780268400.0
nav = "full"
trajectory = { kind = "tle", line1 = "1 38833U 12053A   26150.86639939  .00000051  00000+0  00000+0 0  9997", line2 = "2 38833  53.5827 144.3088 0179371  65.5174 296.3427  2.00567269 99098" }

