; GNSS-SDR config for the synthetic full-NAV fix scene.
; Generate the IQ first:
;   cargo run --release --bin lipika -- \
;       --config examples/gps_fix_synthetic.toml --output out_gpsfix
; then:
;   gnss-sdr --config_file=examples/gnss-sdr-fix.conf
; A position fix should resolve near the receiver (55.86 N, 4.25 W).

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=2048000

;######### SIGNAL SOURCE #########
SignalSource.implementation=File_Signal_Source
SignalSource.filename=out_gpsfix/glasgow__gnss_l1.iq.c64
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2048000
SignalSource.samples=0

;######### SIGNAL CONDITIONER #########
SignalConditioner.implementation=Pass_Through

;######### CHANNELS #########
Channels_1C.count=6
Channels.in_acquisition=6
Channels_1C.route=2,6,12,19,24,25

;######### ACQUISITION #########
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=125
Acquisition_1C.threshold=2.5

;######### TRACKING #########
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=2.0

;######### TELEMETRY DECODER #########
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

;######### OBSERVABLES #########
Observables.implementation=Hybrid_Observables

;######### PVT #########
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=1000
PVT.iono_model=OFF
PVT.trop_model=OFF
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.rinex_version=2
