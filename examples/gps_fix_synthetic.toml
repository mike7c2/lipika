# Synthetic GPS scene that yields a real position fix in GNSS-SDR.
#
# Six circular-Keplerian satellites at GPS altitude, placed so all are well
# above the horizon over Glasgow with good azimuth spread (low GDOP). Each
# carries FULL LNAV (nav = "full"): valid frames + an ephemeris derived in
# closed form from the orbit, so the SV positions the receiver computes match
# the geometry the simulator flies. The fix should resolve at the true receiver
# location (residual ~ metres, from f32 IQ + quantisation only).
#
# epoch_unix is divisible by 6 so subframe edges land on the GPS 6 s Z-count.

[scene]
epoch_unix = 1717260840.0
duration_s = 50.0          # enough to decode subframes 1-3 and fix

# ---------- GPS L1 constellation (a = 26 578 137 m, inclination 55°) ----------

[[transmitter]]
name = "gps_prn02"
carrier_hz = 1_575_420_000.0
tx_power_dbw = 27.0
kind = "ca_code"
prn = 2
epoch_unix = 1717260840.0
nav = "full"
trajectory = { kind = "circular_keplerian", semi_major_axis_m = 26_578_137.0, inclination_deg = 55.0, raan_deg = 270.0, true_anomaly_deg_at_epoch = 90.0, epoch_unix = 1717260840.0 }

