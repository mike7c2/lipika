# GPS scene driven by a RINEX broadcast-ephemeris file.
#
# Each satellite's trajectory is `rinex_nav`: the GPS broadcast ephemeris for
# that PRN is read from a RINEX 3 nav file and used to BOTH fly the orbit (the
# IS-GPS-200 SV-position algorithm) and — with nav = "full" — populate the
# transmitted LNAV. Because it's the same ephemeris, the receiver reconstructs
# the orbit exactly: no osculating fit, no residual.
#
# `examples/gps_synth.rnx` here is a synthetic stand-in (the constellation from
# gps_fix_synthetic.toml, written as RINEX) so the example runs offline. For a
# real scenario, point `file` at a downloaded daily broadcast file, e.g. an IGS
# BRDC `BRDC00IGS_R_<yyy><ddd>0000_01D_GN.rnx`, and set epoch_unix within that
# day; the matching PRNs and their real orbits come straight from the file.
#
# Run from the repository root so the relative path resolves:
#   cargo run --release --bin lipika -- \
#       --config examples/gps_broadcast.toml --output out_bcast

[scene]
epoch_unix = 1717260840.0   # within the validity window of the nav records
duration_s = 120.0

[[transmitter]]
name = "gps_prn02"
carrier_hz = 1_575_420_000.0
tx_power_dbw = 27.0
kind = "ca_code"
prn = 2
epoch_unix = 1717260840.0
nav = "full"
trajectory = { kind = "rinex_nav", file = "examples/gps_synth.rnx", prn = 2 }

