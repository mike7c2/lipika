clock = { allan_deviation_1s = 1e-11, frequency_offset_y0 = 0.5e-6 }
[[receiver.band]]
band_id = "gnss_l1"
lo_carrier_hz = 1_575_420_000.0
sample_rate_hz = 2_048_000.0
noise_temperature_k = 290.0
