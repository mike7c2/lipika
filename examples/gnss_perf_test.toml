# Performance microbenchmark scene.
#
# Single observer at Glasgow, 6 synthetic GPS-like satellites at L1, 30 s
# pass at 1.5 MHz. This is 1/4 the per-observer work of the full DGSN
# scene (which has 4 observers, 250 s, 8 SVs) — convenient for fast
# iteration. Multiply runtime by ~22× to estimate the full DGSN cost.

[scene]
epoch_unix = 1717260840.0
duration_s = 30.0

# 6 synthetic GPS-like satellites: 2 orbital planes × 3 phases.
[[source]]
name = "gps_prn01"
carrier_hz = 1_575_420_000.0
kind = "ca_code"
prn = 1
epoch_unix = 1717260840.0
trajectory = { kind = "circular_keplerian", semi_major_axis_m = 26_578_137.0, inclination_deg = 55.0, raan_deg = 0.0, true_anomaly_deg_at_epoch = 30.0, epoch_unix = 1717260840.0 }

