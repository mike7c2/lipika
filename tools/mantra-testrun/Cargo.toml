[package]
name = "mantra-testrun"
version = "0.1.0"
edition = "2024"
description = "Run each Rust test in its own process with its own LLVM coverage profile and emit a mantra TestRunSchema with per-test-case coverage"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
json5 = "1"
